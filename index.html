<style>
:root {
  font-family: system-ui, "Microsoft JhengHei", sans-serif;
  color: #203e46;
  background: #f4f2ec;
  line-height: 1.65;
}

body { margin: 0; }

.stage canvas { display: block; width: 100%; aspect-ratio: 3/2; }
.caption { margin: 0; background: white; padding: 14px 18px; min-height: 3.2em; font-weight: bold; }

.fill.warning { background: #d97706; }

.line { position: absolute; top: -3px; height: 24px; border-left: 3px solid #345778; z-index: 2; }

.readings { background: #f0f4f0; border-radius: 8px; padding: 12px; margin: 14px 0; font-size: 14px; }
.readings strong { font-size: 20px; }
summary { cursor: pointer; font-weight: bold; }

body.play .debug-only { display: none!important; }
body.play .layout { grid-template-columns: 1fr; margin-top: 0; }
body.play .stage { position: static; max-width: 1100px; width: 100%; margin: auto; }
body.play .stage canvas { max-height: 85vh; object-fit: contain; }
[hidden] { display: none!important; }
@media(max-width:900px){ .layout { grid-template-columns: 1fr; } .stage { position: static; } main { padding: 18px 14px; } }
</style>

<body>
<main>
<header class="debug-only">
  <p class="eyebrow">互動教具 · 第四週 · 聲音改作示範 07（過大爆破版）</p>
  <h1>聲音吹泡泡</h1>
  <p>發聲讓泡泡長大，音量太大會吹爆！安靜後送泡泡飛走。</p>
  <p class="small">預設不需麥克風。先點遊戲區域，再按住 ↑；空白鍵隱藏／顯示控制台。</p>
</header>
<div class="layout">
  <section class="stage" id="stage" tabindex="0" aria-label="聲音吹泡泡互動區域">
    <canvas id="scene" role="img" aria-label="發聲讓泡泡長大，音量過大會破掉。"></canvas>
    <p id="gameState" class="caption"></p>
  </section>
  <aside id="debug" class="panel debug-only">
    <h2>輸入與除錯</h2>
    <label for="input">音量來源</label>
    <select id="input">
      <option value="keyboard">鍵盤模擬：↑ 發聲，放開安靜</option>
      <option value="slider">滑桿模擬：持續指定音量</option>

    </select>
    <div class="buttons">
      <button id="start" disabled>啟用麥克風</button>
      <button id="stop" class="secondary" disabled>停止擷取</button>
    </div>
    <p id="status" class="small" role="status">目前使用鍵盤模擬，不需要麥克風。</p>

    <label for="keyLevel">按鍵／短促音量 <output id="keyLevelValue">65</output></label>
    <input id="keyLevel" type="range" min="0" max="100" value="65">

    <label for="sim">滑桿模擬音量 <output id="simValue">0</output></label>
    <input id="sim" type="range" min="0" max="100" value="0" disabled>

    <div class="buttons">
      <button id="pulse">短促一下</button>
      <button id="zero" class="secondary">模擬歸零</button>
      <button id="reset" class="secondary">重新開始</button>
    </div>

    <div class="readings">
      音量 <strong id="volume">0</strong>／100 · <span id="gateState">安靜</span><br>
      成功釋放：<strong id="count">0</strong> 顆 · 爆破次數：<strong id="burstCount" style="color:#c0392b;">0</strong> 次<br>
      <small>短時間增幅 <span id="rise">0</span></small>
    </div>

    <div class="meter">
      <div id="fill" class="fill"></div>
      <span class="line" id="quietLine" title="安靜門檻"></span>
      <span class="line sound" id="soundLine" title="發聲門檻"></span>
      <span class="line over" id="overLine" title="爆破門檻"></span>
    </div>

    <label for="quiet">安靜門檻 <output id="quietValue">20</output></label>
    <input id="quiet" type="range" min="0" max="90" value="20">

    <label for="sound">發聲門檻 <output id="soundValue">40</output></label>
    <input id="sound" type="range" min="5" max="100" value="40">

    <label for="overVolume">💥 爆破音量門檻 <output id="overVolumeValue">80</output></label>
    <input id="overVolume" type="range" min="50" max="100" value="80">

    <label for="burst">突然聲響增幅 <output id="burstValue">12</output></label>
    <input id="burst" type="range" min="5" max="40" value="12">

    <button class="secondary" id="calibrate" disabled>測量背景音（3 秒）</button>

    <details open>
      <summary>玩法說明與機制</summary>
      <p class="small">💥 <strong>全新機制：音量過大爆破！</strong></p>
      <p class="small">• 聲音維持在「發聲門檻」與「爆破門檻」之間，泡泡會穩定長大。</p>
      <p class="small">• 如果音量突然太大（超過爆破門檻），或是泡泡吹到極限尺寸，泡泡就會爆掉！</p>
      <p class="small">• 掌握聲音的溫柔度，在適當時候停止發聲，就能順利送出泡泡。</p>
    </details>
  </aside>
</div>
</main>

<script>
'use strict';
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const defaults = { quiet: 20, sound: 40, overVolume: 80, gravity: 120, lift: 240, sensitivity: 1, burst: 12 };

class VoiceControl {
  constructor() { this.reset(); }
  reset() {
    this.sounding = false;
    this.smoothed = null;
    this.history = [];
    this.last = null;
    this.cooldown = -Infinity;
    this.burstReady = false;
    this.settledSince = null;
  }
  tick(raw, t, p) {
    if (this.last !== null && t - this.last > 250) this.reset();
    const dt = this.last === null ? 0 : Math.max(0, (t - this.last) / 1000);
    this.last = t;
    this.smoothed = this.smoothed === null ? raw : this.smoothed + (raw - this.smoothed) * (1 - Math.exp(-dt / .065));
    this.history.push({ t, v: raw });
    while (this.history.length > 1 && this.history[1].t <= t - 100) this.history.shift();
    const base = this.history[0], readyWindow = t - base.t >= 80, rise = readyWindow ? raw - base.v : 0;
    if (this.smoothed >= p.sound) this.sounding = true;
    else if (this.smoothed < p.quiet) this.sounding = false;
    
    if (rise < p.burst * .3) {
      if (this.settledSince === null) this.settledSince = t;
      if (t - this.settledSince >= 150) this.burstReady = true;
    } else this.settledSince = null;
    
    let event = false;
    if (readyWindow && this.burstReady && raw >= p.sound && rise >= p.burst && t - this.cooldown >= 600) {
      event = true;
      this.cooldown = t;
      this.burstReady = false;
      this.settledSince = null;
    }
    const intensity = this.sounding ? clamp((this.smoothed - p.quiet) / Math.max(5, p.sound - p.quiet), 0, 2) : 0;
    return {
      volume: this.smoothed,
      rise,
      event,
      sounding: this.sounding,
      force: p.lift * p.sensitivity * intensity,
      eventState: t - this.cooldown < 600 ? '冷卻中' : this.burstReady ? '等待突然增幅' : '等待音量穩定'
    };
  }
}

function playPopSound() {
  try {
    const ctx = context || (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    // Quick pitch sweep down for pop sound
    osc.type = 'sine';
    osc.frequency.setValueAtTime(450, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.08);
    
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  } catch (e) {
    // Ignore audio permission/state errors
  }
}

function makeGame() {
  return {
    current: null,
    floaters: [],
    particles: [],
    shockwaves: [],
    count: 0,
    burstCount: 0,
    burstCooldown: 0,
    message: '溫柔地發聲讓泡泡長大，音量太快會破掉！安靜後送它飛走。'
  };
}

function pauseGame(g) {}

function triggerPop(g, x, y, r, colorIndex) {
  playPopSound();
  
  // Create explosion particles
  const hues = [165, 205, 275, 325, 40];
  const hue = hues[colorIndex || 0];
  const count = Math.floor(16 + r * 0.25);
  
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    const speed = 80 + Math.random() * 180 + r * 1.2;
    g.particles.push({
      x: x + Math.cos(angle) * r * 0.8,
      y: y + Math.sin(angle) * r * 0.8,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 2 + Math.random() * 4,
      hue,
      life: 0,
      maxLife: 0.35 + Math.random() * 0.25
    });
  }
  
  // Create shockwave ring
  g.shockwaves.push({
    x, y, r, maxR: r * 1.5, hue, life: 0, maxLife: 0.3
  });
}

function updateGame(g, r, raw, dt, t) {
  // Update explosion particles
  for (let i = g.particles.length - 1; i >= 0; i--) {
    const p = g.particles[i];
    p.life += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt; // gravity on particles
    if (p.life >= p.maxLife) g.particles.splice(i, 1);
  }
  
  // Update shockwaves
  for (let i = g.shockwaves.length - 1; i >= 0; i--) {
    const sw = g.shockwaves[i];
    sw.life += dt;
    sw.r += (sw.maxR - sw.r) * dt * 10;
    if (sw.life >= sw.maxLife) g.shockwaves.splice(i, 1);
  }

  // Handle current blowing bubble
  if (r.sounding) {
    if (!g.current) {
      if (t > g.burstCooldown) {
        g.current = { r: 15, color: Math.floor(Math.random() * 5) };
      }
    }
    
    if (g.current) {
      // OVER VOLUME BURST CHECK
      if (r.volume >= params.overVolume) {
        triggerPop(g, 450, 435, g.current.r, g.current.color);
        g.current = null;
        g.burstCount++;
        g.burstCooldown = t + 700; // Protection time before spawning next
        g.message = '💥 音量太大了！泡泡被吹爆了！控制聲音小一點再試一次。';
      } else {
        // Normal growth
        g.current.r = Math.min(130, g.current.r + dt * (12 + r.volume * 0.45));
        
        // Overflow size burst check
        if (g.current.r >= 130) {
          triggerPop(g, 450, 435, g.current.r, g.current.color);
          g.current = null;
          g.burstCount++;
          g.burstCooldown = t + 700;
          g.message = '💥 泡泡太大了，承受不住破掉了！';
        } else {
          const warning = r.volume >= params.overVolume * 0.82;
          g.message = warning 
            ? '⚠️ 音量快太大了！注意控制控制聲音，隨時會爆掉！' 
            : '持續集氣中…安靜後釋放泡泡。';
        }
      }
    }
  } else if (g.current) {
    // Sound stopped -> Release bubble!
    g.floaters.push({ ...g.current, x: 450, y: 435, age: 0, drift: Math.random() * 60 - 30 });
    g.current = null;
    g.count++;
    if (g.floaters.length > 40) g.floaters.shift();
    g.message = '🎉 停止發聲，成功釋放一顆泡泡！';
  } else if (t <= g.burstCooldown) {
    // Cooling after burst
  } else {
    g.message = '安靜中。保持溫柔聲音，製作下一顆泡泡。';
  }

  // Update floating bubbles
  for (const b of g.floaters) {
    b.age += dt;
    b.y -= dt * (24 + 60 / (1 + b.r / 20));
    b.x += Math.sin(b.age * 1.4) * dt * 18 + b.drift * dt * .2;
  }
  g.floaters = g.floaters.filter(b => b.y + b.r > -20 && b.age < 35);
}

function bubble(x, y, r, color, isShaking = false) {
  const hues = [165, 205, 275, 325, 40], h = hues[color];
  const shakeX = isShaking ? (Math.random() - 0.5) * 4 : 0;
  const shakeY = isShaking ? (Math.random() - 0.5) * 4 : 0;
  const cx = x + shakeX, cy = y + shakeY;

  const grad = paint.createRadialGradient(cx - r * .3, cy - r * .4, 1, cx, cy, r);
  grad.addColorStop(0, 'hsla(' + h + ',70%,98%,.6)');
  grad.addColorStop(.75, 'hsla(' + h + ',70%,75%,.14)');
  grad.addColorStop(1, 'hsla(' + h + ',60%,65%,.7)');
  
  paint.fillStyle = grad;
  paint.beginPath();
  paint.arc(cx, cy, r, 0, Math.PI * 2);
  paint.fill();
  
  paint.strokeStyle = 'hsla(' + h + ',60%,60%,.8)';
  paint.lineWidth = 2;
  paint.stroke();
  
  // Highlight
  paint.strokeStyle = '#ffffffcc';
  paint.lineWidth = Math.max(2, r * .04);
  paint.beginPath();
  paint.arc(cx, cy, r * .75, Math.PI * 1.1, Math.PI * 1.5);
  paint.stroke();
}

function drawGame(g, t) {
  // Background
  paint.fillStyle = '#e8f2ef';
  paint.fillRect(0, 0, 900, 600);
  
  // Floor tube base
  paint.fillStyle = '#d2e4dc';
  paint.beginPath();
  paint.ellipse(450, 625, 570, 120, 0, 0, Math.PI * 2);
  paint.fill();
  
  // Released floating bubbles
  g.floaters.forEach(b => bubble(b.x, b.y, b.r, b.color));
  
  // Blower nozzle
  paint.strokeStyle = '#789689';
  paint.lineWidth = 9;
  paint.beginPath();
  paint.moveTo(450, 565);
  paint.lineTo(450, 495);
  paint.stroke();
  paint.lineWidth = 5;
  paint.beginPath();
  paint.ellipse(450, 473, 30, 12, 0, 0, Math.PI * 2);
  paint.stroke();

  // Current growing bubble
  if (g.current) {
    const isWarning = voice.smoothed >= params.overVolume * 0.82;
    bubble(450, 435, g.current.r, g.current.color, isWarning);
  }

  // Draw explosion shockwaves
  for (const sw of g.shockwaves) {
    const alpha = 1 - (sw.life / sw.maxLife);
    paint.strokeStyle = `hsla(${sw.hue}, 80%, 60%, ${alpha})`;
    paint.lineWidth = 3;
    paint.beginPath();
    paint.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    paint.stroke();
  }

  // Draw explosion particles
  for (const p of g.particles) {
    const alpha = 1 - (p.life / p.maxLife);
    paint.fillStyle = `hsla(${p.hue}, 80%, 65%, ${alpha})`;
    paint.beginPath();
    paint.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    paint.fill();
  }

  // Title on canvas
  paint.fillStyle = '#355e54';
  paint.font = '26px system-ui';
  paint.textAlign = 'center';
  paint.fillText('用聲音送泡泡旅行（小心太吵會爆掉！）', 450, 55);
}

const $ = id => document.getElementById(id), params = { ...defaults }, voice = new VoiceControl();
const canvas = $('scene'), paint = canvas.getContext('2d');
canvas.width = 900; canvas.height = 600;

let context = null, stream = null, source = null, analyser = null, samples = null, session = 0, running = false, pending = false, held = false, pulseUntil = 0, debug = true, last = null, lastUi = 0, calibration = null;
let game = makeGame();

function zero() { held = false; pulseUntil = 0; $('sim').value = 0; $('simValue').textContent = '0'; }

function stop(message = '已停止麥克風。') {
  session++; running = false; pending = false; calibration = null;
  if (stream) { stream.getTracks().forEach(t => { t.onended = null; t.onmute = null; t.stop(); }); stream = null; }
  if (source) { source.disconnect(); source = null; }
  if (context) { const old = context; context = null; old.onstatechange = null; old.close().catch(() => {}); }
  analyser = null; voice.reset(); zero(); $('status').textContent = message; controls();
}

function controls() {
  const mode = $('input').value;
  for (const id of ['start']) $(id).disabled = mode !== 'mic' || running || pending;
  $('stop').disabled = !running && !pending;
  $('calibrate').disabled = !running || !!calibration;
  $('sim').disabled = mode !== 'slider';
  $('keyLevel').disabled = mode === 'mic';
  $('pulse').disabled = mode === 'mic';
  for (const id of ['quiet', 'sound', 'overVolume', 'burst']) $(id).disabled = !!calibration;
}

function configure(changed) {
  let q = +$('quiet').value, s = +$('sound').value, o = +$('overVolume').value;
  if (s - q < 5) {
    if (changed === 'sound') q = s - 5;
    else s = q + 5;
  }
  if (o <= s) {
    o = s + 5;
  }
  $('quiet').value = q; $('sound').value = s; $('overVolume').value = o;
  
  for (const id of ['quiet', 'sound', 'overVolume', 'burst']) {
    params[id] = +$(id).value;
    $(id + 'Value').textContent = params[id];
  }
  $('quietLine').style.left = q + '%';
  $('soundLine').style.left = s + '%';
  $('overLine').style.left = o + '%';
  voice.reset();
}

async function start() {
  if (running || pending || $('input').value !== 'mic') return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    $('status').textContent = '麥克風不可用，請使用 HTTPS／localhost 或切換模擬輸入。'; return;
  }
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) { $('status').textContent = '瀏覽器不支援音訊分析，請使用模擬輸入。'; return; }
  
  const id = ++session; pending = true; controls();
  $('status').textContent = '請允許麥克風，或按停止取消。';
  
  try {
    const local = new Audio(); context = local; await local.resume();
    if (id !== session) return;
    const incoming = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
    if (id !== session) { incoming.getTracks().forEach(t => t.stop()); return; }
    stream = incoming; source = local.createMediaStreamSource(incoming);
    analyser = local.createAnalyser(); analyser.fftSize = 1024;
    source.connect(analyser); samples = new Float32Array(analyser.fftSize);
    
    const track = incoming.getAudioTracks()[0];
    track.onended = () => { if (id === session) stop('麥克風中斷，請重新啟用。'); };
    track.onmute = () => { if (id === session) stop('麥克風暫時無聲，已停止擷取。'); };
    if (local.state !== 'running') { stop('音訊未啟動，請重新啟用。'); return; }
    local.onstatechange = () => { if (id === session && local.state !== 'running') stop('音訊中斷，請重新啟用。'); };
    
    running = true; pending = false; voice.reset(); controls();
    $('status').textContent = '正在接收麥克風，只在本頁分析，不錄音、不上傳、不回放。';
  } catch (e) {
    if (id !== session) return;
    stop(e.name === 'NotAllowedError' ? '麥克風權限未允許，可切換模擬輸入。' : '麥克風啟用失敗，可切換模擬輸入。');
  }
}

function inputLevel(t) {
  const mode = $('input').value;
  if (mode === 'mic') {
    if (!running) return 0;
    analyser.getFloatTimeDomainData(samples);
    let sum = 0;
    for (const x of samples) sum += x * x;
    const rms = Math.sqrt(sum / samples.length);
    return clamp(((rms > 0 ? 20 * Math.log10(rms) : -Infinity) + 60) / 60 * 100, 0, 100);
  }
  const base = mode === 'keyboard' ? (held ? +$('keyLevel').value : 0) : +$('sim').value;
  return t < pulseUntil ? Math.max(base, +$('keyLevel').value) : base;
}

function frame(t) {
  const dt = last === null ? 0 : clamp((t - last) / 1000, 0, .05);
  last = t;
  const raw = inputLevel(t);
  let r;

  if (calibration) {
    calibration.values.push(raw);
    $('status').textContent = '背景音測量 ' + Math.min(3, (t - calibration.start) / 1000).toFixed(1) + '／3 秒，請保持安靜。';
    r = { sounding: false, event: false, volume: raw, rise: 0 };
    if (t - calibration.start >= 3000) {
      const values = calibration.values.sort((a, b) => a - b);
      const base = values[Math.floor((values.length - 1) * .9)];
      $('quiet').value = Math.min(90, Math.ceil(base + 6));
      $('sound').value = Math.min(100, Math.ceil(base + 18));
      calibration = null;
      configure('sound');
      controls();
      $('status').textContent = '門檻已更新，請試玩後再微調。' + (base >= 80 ? '背景偏高，建議調整位置或設備增益。' : '');
    }
  } else {
    r = voice.tick(raw, t, params);
  }

  updateGame(game, r, raw, dt, t);
  drawGame(game, t);

  if (debug && t - lastUi >= 90) {
    lastUi = t;
    $('volume').textContent = Math.round(raw);
    const fillEl = $('fill');
    fillEl.style.width = raw + '%';
    fillEl.className = 'fill' + (raw >= params.overVolume ? ' danger' : raw >= params.overVolume * 0.82 ? ' warning' : '');
    
    $('gateState').textContent = raw >= params.overVolume ? '💥 音量過大' : r.sounding ? '發聲' : '安靜';
    $('rise').textContent = r.rise.toFixed(1);
    $('count').textContent = game.count;
    $('burstCount').textContent = game.burstCount;
  }
  
  $('gameState').textContent = game.message;
  requestAnimationFrame(frame);
}

function isControl(e) {
  return e.target instanceof Element && (e.target.isContentEditable || e.target.closest('input, textarea, select, button, a, summary'));
}

$('stage').addEventListener('click', () => $('stage').focus({ preventScroll: true }));
document.addEventListener('keydown', e => {
  if (e.isComposing || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey || isControl(e)) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    debug = !debug;
    document.body.classList.toggle('play', !debug);
    $('debug').hidden = !debug;
    $('stage').focus({ preventScroll: true });
  } else if (e.code === 'ArrowUp' && $('input').value === 'keyboard') {
    e.preventDefault();
    held = true;
  }
});

document.addEventListener('keyup', e => { if (e.code === 'ArrowUp') held = false; });
$('input').addEventListener('change', () => { stop('已切換輸入，先點遊戲區域再操作。'); controls(); });
$('start').addEventListener('click', start);
$('stop').addEventListener('click', () => stop());

for (const id of ['quiet', 'sound', 'overVolume', 'burst']) $(id).addEventListener('input', () => configure(id));
for (const id of ['sim', 'keyLevel']) $(id).addEventListener('input', () => { $(id + 'Value').textContent = $(id).value; });

$('pulse').addEventListener('click', () => { pulseUntil = performance.now() + 220; });
$('zero').addEventListener('click', zero);
$('reset').addEventListener('click', () => { zero(); voice.reset(); game = makeGame(); });
$('calibrate').addEventListener('click', () => { if (!running) return; voice.reset(); calibration = { start: performance.now(), values: [] }; controls(); });

window.addEventListener('blur', () => { zero(); voice.reset(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stop('頁面已切到背景，麥克風已停止；模擬輸入已歸零。'); last = null; pauseGame(game); }
});
window.addEventListener('pagehide', () => stop());

configure();
controls();
requestAnimationFrame(frame);
</script>
</body>
</html>
